[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baslangic-optimizasyon-araci"
version = "0.1.0"
description = "Parses real systemd-analyze boot-time data on a real Linux target and suggests services safe to disable for a faster boot."
requires-python = ">=3.9"
license = { text = "MIT" }

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
baslangic-optimizasyon-araci = "baslangic_optimizasyon_araci.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
